name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: python -m pip install --upgrade pip ruff

      - name: Gate - ruff
        run: ruff check .

  unit-and-gates:
    name: Unit tests + URI glue gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Assemble LLM prompt artifact
        run: python scripts/assemble_llm_prompt.py

      - name: Gate - unit tests
        run: python -m pytest -q

      - name: Gate - URI glue (no subprocess anti-patterns)
        run: python scripts/validate_examples.py

      - name: Gate - process JSON schema
        run: python scripts/validate_processes.py

      - name: Gate - route schema snapshot (offline CI)
        run: python scripts/snapshot_route_schemas.py --validate-only

      - name: Gate - first_system_prompt.md exists
        run: test -s docs/llm/first_system_prompt.md

  mock-runtime-smoke:
    name: Mock runtime smoke
    runs-on: ubuntu-latest
    needs: unit-and-gates
    steps:
      - uses: actions/checkout@v7

      - name: Start mock node
        run: |
          docker compose up -d --build urirun-mock
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8765/health

      - name: POST /run on mock
        run: |
          curl -sf -X POST http://127.0.0.1:8765/run \
            -H 'Content-Type: application/json' \
            -d '{"uri":"kvm://host/doctor/query/report","payload":{}}' \
            | grep -q '"ok"'

  if-uri-runtime-smoke:
    name: Real urirun runtime smoke (blocking)
    runs-on: ubuntu-latest
    needs: unit-and-gates
    steps:
      - uses: actions/checkout@v7
        with:
          path: urirun-llm-runtime

      - uses: actions/checkout@v7
        with:
          repository: if-uri/urirun
          path: urirun

      - name: Install current urirun and runtime client
        working-directory: urirun-llm-runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../urirun/adapters/python
          python -m pip install -e .

      - name: Start real urirun node
        working-directory: urirun-llm-runtime
        run: |
          cat > smoke.bindings.json <<'JSON'
          {
            "version": "urirun.bindings.v2",
            "bindings": {
              "env://host/runtime/query/health": {
                "adapter": "argv-template",
                "kind": "query",
                "argv": ["python", "-c", "import json; print(json.dumps({'ok': True, 'source': 'ci-smoke'}))"],
                "inputSchema": {"type": "object", "properties": {}, "additionalProperties": false}
              }
            }
          }
          JSON
          python -m urirun.v2 compile smoke.bindings.json --out smoke.registry.json
          python -m urirun.v2 node serve --name host --registry smoke.registry.json --host 127.0.0.1 --port 18765 --execute --allow 'env://host/**' > urirun-node.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18765/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18765/health

      - name: Gate - /routes and /run
        run: |
          curl -sf http://127.0.0.1:18765/routes | python -c "import sys,json; d=json.load(sys.stdin); routes=d.get('routes', d); assert any(r.get('uri') == 'env://host/runtime/query/health' for r in routes), routes"
          curl -sf -X POST http://127.0.0.1:18765/run \
            -H 'Content-Type: application/json' \
            -d '{"uri":"env://host/runtime/query/health","mode":"execute","payload":{}}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') is True, d"

      - name: Gate - Executor against live node
        working-directory: urirun-llm-runtime
        run: |
          python -c "
          from urirun_llm_runtime import Executor
          e = Executor('http://127.0.0.1:18765')
          h = e.health()
          assert h.get('ok') is True, h
          routes = e.routes()
          assert 'env://host/runtime/query/health' in routes, routes
          r = e.execute('env://host/runtime/query/health')
          assert r.get('ok') is True, r
          print('live execute OK')
          "

      - name: Node logs on failure
        if: failure()
        run: cat urirun-node.log || true
