name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-gates:
    name: Unit tests + URI glue gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Assemble LLM prompt artifact
        run: python scripts/assemble_llm_prompt.py

      - name: Gate — unit tests
        run: python -m pytest -q

      - name: Gate — URI glue (no subprocess anti-patterns)
        run: python scripts/validate_examples.py

      - name: Gate — process JSON schema
        run: python scripts/validate_processes.py

      - name: Gate — first_system_prompt.md exists
        run: test -s docs/llm/first_system_prompt.md

  mock-runtime-smoke:
    name: Mock runtime smoke
    runs-on: ubuntu-latest
    needs: unit-and-gates
    steps:
      - uses: actions/checkout@v4

      - name: Start mock node
        run: |
          docker compose up -d --build urirun-mock
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8765/health

      - name: POST /run on mock
        run: |
          curl -sf -X POST http://127.0.0.1:8765/run \
            -H 'Content-Type: application/json' \
            -d '{"uri":"kvm://host/doctor/query/report","payload":{}}' \
            | grep -q '"ok"'

  if-uri-runtime-smoke:
    name: Real if-uri runtime smoke (blocking)
    runs-on: ubuntu-latest
    needs: unit-and-gates
    steps:
      - uses: actions/checkout@v4
        with:
          path: urirun-llm-runtime

      - uses: actions/checkout@v4
        with:
          repository: if-uri/if-uri
          path: if-uri

      - name: Write runtime .env
        working-directory: urirun-llm-runtime
        run: |
          echo "IF_URI_ROOT=${{ github.workspace }}/if-uri" > runtime/.env
          echo "HOST_NODE_PORT=18765" >> runtime/.env

      - name: Build and start host-node
        working-directory: urirun-llm-runtime
        run: |
          docker compose -f runtime/docker-compose.yml build host-node
          docker compose -f runtime/docker-compose.yml up -d host-node
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18765/health && break
            sleep 5
          done
          curl -sf http://127.0.0.1:18765/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ok'] and d['routeCount']>10"

      - name: Gate — URI smoke profile
        working-directory: urirun-llm-runtime
        run: docker compose -f runtime/docker-compose.yml --profile smoke run --rm uri-smoke

      - name: Gate — Executor against live node
        working-directory: urirun-llm-runtime
        run: |
          pip install -e .
          python -c "
          from urirun_llm_runtime import Executor
          e = Executor('http://127.0.0.1:18765')
          r = e.execute('kvm://host/env/query/profile')
          assert r.get('ok') is not False, r
          print('live execute OK')
          "
