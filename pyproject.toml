[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-llm-runtime"
version = "0.2.3"
description = "Canonical LLM-facing URI process runtime — spec, executor, CI gates"
authors = [{ name = "ifURI" }, {name = "Tom Sapletta",email = "tom@sapletta.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.0",
    "jsonschema>=4.18",
    "python-dotenv>=1.0",
]
license = "Apache-2.0"

[project.scripts]
urirun-llm = "urirun_llm_runtime.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "flask>=2.0", "Pillow>=10", "ruff>=0.6",
    "goal>=2.1.0",
    "costs>=0.1.53",
    "pfix>=0.1.60",
]
# Executor.capture_for_llm() lazy-imports Pillow to enforce screenshot size limits
# client-side; without it, capture_for_llm() still works but skips the client-side
# safety net (server-provided images are passed through as-is, possibly oversized).
llm-vision = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["urirun_llm_runtime*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# scripts/*.py insert ROOT onto sys.path before importing the local package —
# an intentional, standalone-script pattern; not the E402 anti-pattern the rule targets.
"scripts/*.py" = ["E402"]

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
