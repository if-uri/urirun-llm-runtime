[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-llm-runtime"
version = "0.1.0"
description = "Canonical runtime wrapper and spec for URI-based process execution (ifURI)"
authors = [ { name = "ifURI" } ]
dependencies = [
    "requests>=2.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]